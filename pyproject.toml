[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-agentic-proxy"
version = "0.4.0"
description = "A Dual-Engine MCP Server and OpenAI API Gateway for deterministic local model tool calling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KruschDev", email = "krusch@example.com" }
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastmcp>=0.1.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "starlette>=0.46.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[project.scripts]
krusch-agentic-mcp = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "benchmarks"]
